packages:
  - lib/cli
  - lib/core
  - lib/changelog-emitter
  - lib/ts-sdk
  - website

allowBuilds:
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: false
  tree-sitter: false
  tree-sitter-json: false
  workerd: false

catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^22.20.4
  '@typespec/compiler': ^1.17.0
  '@typespec/http': ^1.17.0
  '@typespec/json-schema': ^1.17.0
  '@typespec/openapi': ^1.17.0
  '@typespec/openapi3': ^1.17.0
  '@typespec/rest': ^0.87.0
  '@typespec/versioning': ^0.87.0
  '@vitest/coverage-v8': ^4.1.12
  '@vitest/eslint-plugin': ^1.6.27
  eslint: ^10.11.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-prettier: ^5.5.6
  globals: ^17.12.0
  prettier: ^3.9.9
  ts-node: ^10.9.2
  typescript: ^6.0.3
  typescript-eslint: ^8.70.1
  vitest: ^4.1.12
  zod: ^4.6.7

catalogs:
  website:
    vitest: ^4.1.12

overrides:
  # No patched postcss-selector-parser 6.x exists, so this crosses postcss-nested's
  # ^6 range on purpose. Delete once the lockfile has no postcss-nested 6.2.0.
  'postcss-nested@6.2.0>postcss-selector-parser': '>=7.1.6 <8'
  # miniflare (via wrangler and @cloudflare/vite-plugin) and @scalar/json-magic 0.13
  # pin undici 7.x below the patched 7.30.1. Delete once neither pins undici <7.30.1.
  'undici@>=7 <7.30.1': '^7.30.1'
  # GHSA-g3hv-75wg-m249 is patched only in minimatch 11, so this crosses the ranges of
  # eslint, @eslint/config-array, @typescript-eslint/typescript-estree (minimatch 10) and
  # glob 10 (minimatch 9) on purpose. Delete once none of them resolve minimatch <11.0.1.
  'minimatch@<11.0.1': '>=11.0.1 <12'
  # GHSA-3g3m-2fjr-6pw4 is patched only in glob 14, so this crosses rimraf 5's glob ^10
  # range (via lib/core) on purpose. Delete once rimraf no longer resolves glob <14.0.2.
  'glob@>=9.0.0 <=14.0.1': '>=14.0.2 <15'
