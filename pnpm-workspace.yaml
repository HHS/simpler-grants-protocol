packages:
  - lib/cli
  - lib/core
  - lib/changelog-emitter
  - lib/ts-sdk
  - website

allowBuilds:
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: false
  tree-sitter: false
  tree-sitter-json: false
  workerd: false

catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^22.20.4
  '@typespec/compiler': ^1.17.0
  '@typespec/http': ^1.17.0
  '@typespec/json-schema': ^1.17.0
  '@typespec/openapi': ^1.17.0
  '@typespec/openapi3': ^1.17.0
  '@typespec/rest': ^0.87.0
  '@typespec/versioning': ^0.87.0
  '@vitest/coverage-v8': ^4.1.11
  '@vitest/eslint-plugin': ^1.6.27
  eslint: ^10.11.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-prettier: ^5.5.6
  globals: ^17.12.0
  prettier: ^3.9.9
  ts-node: ^10.9.2
  typescript: ^6.0.3
  typescript-eslint: ^8.70.1
  vitest: ^4.1.11
  zod: ^4.5.0

catalogs:
  website:
    vitest: ^4.1.11

overrides:
  # No patched postcss-selector-parser 6.x exists, so this crosses postcss-nested's
  # ^6 range on purpose. Delete once the lockfile has no postcss-nested 6.2.0.
  'postcss-nested@6.2.0>postcss-selector-parser': '>=7.1.6 <8'
  # Security floors for advisories that blocked the release gate. Each stays
  # inside its parent's major; delete once the lockfile resolves past it unaided.
  body-parser@<1.20.9: '>=1.20.9 <2'
  fast-uri@>=3.0.0 <3.1.9: '>=3.1.9 <4'
  undici@>=6.0.0 <6.29.1: '>=6.29.1 <7'
  # miniflare and @scalar/json-magic pin undici exactly, so this crosses their
  # pin by a patch. Delete once both pins reach 7.30.1.
  undici@>=7.0.0 <7.30.1: '>=7.30.1 <8'
  # No patched zod 3.x exists. cg-grants-gov 0.3.1 (a ts-sdk devDependency for
  # an example) and its SDK 0.6.1 peer still declare zod ^3, so this crosses
  # their range on purpose. Delete once ts-sdk uses a cg-grants-gov on zod 4.
  '@common-grants/cg-grants-gov@0.3.1>zod': '>=4.6.6 <5'
  '@common-grants/sdk@0.6.1>zod': '>=4.6.6 <5'
