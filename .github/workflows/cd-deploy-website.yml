name: "CD - Deploy Website to GH Pages"

on:
  # Trigger the workflow every time we push to the `main` branch
  # if it includes changes to the website/ directory
  push:
    branches: [main]
    paths:
      - "website/**"
  # Allows us to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter website build

      - name: Upload Pages artifact
        # `dist/client`, not `dist`: adding the `@astrojs/cloudflare` adapter
        # (#1078-T2) splits the build output into `dist/client` (the prerendered
        # site) and `dist/server` (the Worker for the one dynamic API route).
        # Uploading `dist` wholesale would publish the site one level down, under
        # /client/, and ship the Worker bundle as public files.
        #
        # GitHub Pages cannot run the API route at all, so `/api/*` 404s here —
        # expected, and why the docs' mock wiring is gated off in this build (no
        # `MOCK_API_ENABLED`, so no `servers:` block and no Execute button).
        #
        # Redirects need care here (#1078-T2/T3). The adapter takes them over:
        # `astro.config.mjs`'s `redirects` block used to be emitted as meta-refresh
        # HTML pages, but the adapter writes `dist/client/_redirects` instead and
        # emits no HTML, and `build.redirects: true` does not override that. GitHub
        # Pages does not read `_redirects`, so that alone would 404 all 8 redirect
        # patterns here. They are served instead by committed meta-refresh pages
        # under `website/public/`, which bypass Astro's redirect handling entirely.
        # `website/__tests__/redirects.spec.ts` fails if a configured redirect ever
        # loses its page, so this does not silently regress again.
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy from main branch
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
