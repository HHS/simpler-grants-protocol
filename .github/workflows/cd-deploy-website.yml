name: "CD - Deploy Website to GH Pages"

on:
  # Trigger the workflow every time we push to the `main` branch
  # if it includes changes to the website/ directory
  push:
    branches: [main]
    paths:
      - "website/**"
  # Allows us to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter website build

      - name: Upload Pages artifact
        # `dist/client`, not `dist`: adding the `@astrojs/cloudflare` adapter
        # (#1078-T2) splits the build output into `dist/client` (the prerendered
        # site) and `dist/server` (the Worker for the one dynamic API route).
        # Uploading `dist` wholesale would publish the site one level down, under
        # /client/, and ship the Worker bundle as public files.
        #
        # GitHub Pages cannot run the API route at all, so `/api/*` 404s here —
        # expected, and why the docs' mock wiring is gated off in this build (no
        # `MOCK_API_ENABLED`, so no `servers:` block and no Execute button).
        #
        # KNOWN REGRESSION (#1078-T2, unresolved): the adapter also takes over
        # redirects. `astro.config.mjs`'s `redirects` block used to be emitted as
        # meta-refresh HTML pages; the adapter writes it to
        # `dist/client/_redirects` instead and emits no HTML, and `build.redirects:
        # true` does not override that. GitHub Pages does not read `_redirects`, so
        # all 8 redirect patterns (4 opp-model consolidations, 4 forms migrations
        # including `/forms-new/[slug]`) 404 on production until either the
        # Cloudflare migration lands or the pages are emitted some other way.
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy from main branch
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
