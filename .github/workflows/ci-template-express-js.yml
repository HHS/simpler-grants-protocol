name: "CI - Template: Express.js Run Checks"

on:
  workflow_call:
  pull_request:
    paths:
      - templates/express-js/**
      - .github/workflows/ci-template-express-js.yml

defaults:
  run:
    working-directory: ./templates/express-js

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: templates/express-js/pnpm-lock.yaml

      - name: Install dependencies
        # Installs dependencies directly from pnpm-lock.yaml and skips
        # dependency resolution. The template's own pnpm-workspace.yaml
        # marks it as a standalone root (and holds its security overrides),
        # so pnpm does not resolve into the monorepo workspace.
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run checks

      - name: Build library
        run: pnpm run build

      - name: Audit dependencies
        run: pnpm audit --audit-level=low
