name: "CI - Python SDK: Run Checks"

on:
  pull_request:
    paths:
      - "lib/python-sdk/**"
      - ".github/workflows/ci-lib-pysdk.yml"
      # The award schema check validates against the emitted Core contract and the
      # TS SDK's TypeSpec route bundle, using the TS SDK's locked AJV tooling.
      - "lib/core/**"
      - "website/public/schemas/**"
      - "lib/ts-sdk/lib/**"
      - "lib/ts-sdk/package.json"
      - "lib/ts-sdk/tspconfig.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

defaults:
  run:
    working-directory: ./lib/python-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: Gr1N/setup-poetry@v9

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        id: install
        run: make install

      - name: Run checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make checks

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test

      # The schema oracle needs the TS SDK's AJV dependencies and its generated
      # award route bundle; a missing piece fails the step rather than skipping it.
      - name: Generate award route schemas
        id: route-schemas
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .
        run: |
          pnpm --filter "@common-grants/sdk..." install --frozen-lockfile
          pnpm --filter @common-grants/core run build
          pnpm --filter @common-grants/sdk run typespec

      - name: Check award fixtures against emitted schemas
        if: ${{ !cancelled() && steps.route-schemas.outcome == 'success' }}
        run: make check-award-schema

      - name: Build package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make build
