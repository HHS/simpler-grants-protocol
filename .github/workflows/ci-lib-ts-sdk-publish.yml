name: "CI - TypeScript SDK: Publish to npm (dry run)"

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/ts-sdk/**" # Trigger only if files in the `lib/ts-sdk/` directory are changed
      - ".github/workflows/ci-lib-ts-sdk-publish.yml"

defaults:
  run:
    working-directory: ./lib/ts-sdk

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 supplies the same npm 11 publishing client used by releases.
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors the release workflow's packaging and client: pnpm packs
      # (resolving the `catalog:` specifiers), then npm checks the tarball
      # is publishable — it reads, its manifest parses, the version is valid
      # semver, the dist-tag is legal. Deeper validation lives behind the real
      # publish, and --provenance cannot run without the OIDC token this
      # workflow deliberately does not get.
      #
      # npm runs outside the checkout because the root package.json's npm
      # `workspaces: ["lib/**"]` glob also matches the built
      # `lib/changelog-emitter/dist/`, which npm rejects as a duplicate package.
      - name: Pack package
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      # --force drops three of npm's publish checks: two registry-state ones —
      # version already published (always true on a PR, since the bump lands in
      # the Release PR) and version lower than the current latest — plus the
      # local prerelease-needs---tag check. Without it every PR here fails. All
      # three still guard the real publish, which passes no --force, so they can
      # still fail a release that PR CI passed. --dry-run keeps anything here
      # from reaching the registry.
      - name: Dry run publish
        working-directory: ${{ runner.temp }}
        run: npm publish --dry-run --force --access public package.tgz
