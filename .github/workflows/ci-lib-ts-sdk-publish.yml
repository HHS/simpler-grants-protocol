name: "CI - TypeScript SDK: Publish to npm (dry run)"

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/ts-sdk/**" # Trigger only if files in the `lib/ts-sdk/` directory are changed
      - ".github/workflows/ci-lib-ts-sdk-publish.yml"

defaults:
  run:
    working-directory: ./lib/ts-sdk

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 supplies the same npm 11 publishing client used by releases.
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Match release packaging: pnpm resolves workspace `catalog:` specs into
      # the tarball.
      - name: Pack package
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      # Run npm from runner.temp to avoid the workspace duplicate. --force skips
      # checks that reject current PR versions; real publish keeps them, while
      # --dry-run prevents upload.
      - name: Dry run publish
        working-directory: ${{ runner.temp }}
        run: npm publish --dry-run --force --access public package.tgz
