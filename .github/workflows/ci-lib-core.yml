name: "CI - Core: Run Checks"

on:
  workflow_call:
  pull_request:
    paths:
      - lib/core/**
      - website/src/content/docs/getting-started.mdx
      - website/src/lib/quickstart/**
      - website/src/scripts/check-quickstarts.ts
      # The quickstart check compiles with the website's TypeSpec emitters
      - website/package.json
      - pnpm-workspace.yaml
      - .github/workflows/ci-lib-core.yml

defaults:
  run:
    working-directory: ./lib/core

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter @common-grants/core run checks

      - name: Build library
        run: pnpm --filter @common-grants/core run build

      - name: Emit TypeSpec outputs
        run: pnpm --filter @common-grants/core run typespec

      # Compiles the Getting Started and README quickstarts against this core
      - name: Compile quickstarts
        run: pnpm --filter website run check:quickstarts
