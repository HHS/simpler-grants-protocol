name: "CD - Deploy Python Package to PyPI"

on:
  # Called by release-please.yml when a Python SDK release is created
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., common-grants-sdk@0.3.0)"
        required: true
        type: string
  # Manual fallback for re-running a publish against an existing tag
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., common-grants-sdk@0.3.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/common-grants-sdk
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./lib/python-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: Gr1N/setup-poetry@v9

      - name: Install dependencies
        run: poetry install

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry build
          poetry publish

      - name: Notify completion
        run: |
          echo "Python SDK deployed to PyPI"
          echo "Tag: ${{ inputs.release_tag }}"
