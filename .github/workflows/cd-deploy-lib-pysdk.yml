name: "CD - Deploy Python Package to PyPI"

on:
  # Called by release-please.yml when a Python SDK release is created
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., common-grants-sdk@0.3.0)"
        required: true
        type: string
  # Manual fallback for re-running a publish against an existing tag
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., common-grants-sdk@0.3.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/common-grants-sdk
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./lib/python-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      # Rejects a mistyped or spoofed ref (a branch, or another package's tag).
      # release-please's own tag always passes, so this only ever fires on the
      # manual workflow_dispatch fallback.
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^common-grants-sdk@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like 'common-grants-sdk@X.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::release_tag is not an existing tag. Got: $RELEASE_TAG"
            exit 1
          fi

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: Gr1N/setup-poetry@v9

      - name: Install dependencies
        run: poetry install

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry build
          poetry publish

      - name: Notify completion
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Python SDK deployed to PyPI"
          echo "Tag: $RELEASE_TAG"
