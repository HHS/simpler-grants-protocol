name: "CD - Deploy Python Package to PyPI"

on:
  # Called by release-please.yml when a Python SDK release is created
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., common-grants-sdk@0.3.0)"
        required: true
        type: string
    secrets:
      PYPI_TOKEN:
        required: true
  # Manual fallback for re-running a publish against an existing tag
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., common-grants-sdk@0.3.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/common-grants-sdk
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./lib/python-sdk

    steps:
      # Rejects another package's tag or a malformed version on the manual
      # workflow_dispatch fallback; release-please's own tag always passes.
      # Runs before checkout (in the bare workspace) so nothing ever touches
      # content from an unvalidated ref.
      - name: Validate release tag
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^common-grants-sdk@[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::release_tag must look like 'common-grants-sdk@X.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # The refs/tags/ qualifier pins the checkout to the tag namespace — a
      # branch with the same name can't be substituted, and a nonexistent tag
      # fails the checkout outright.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: Gr1N/setup-poetry@v9

      - name: Install dependencies
        run: poetry install

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry build
          poetry publish

      - name: Notify completion
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Python SDK deployed to PyPI"
          echo "Tag: $RELEASE_TAG"
