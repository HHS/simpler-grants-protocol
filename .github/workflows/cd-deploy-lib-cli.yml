name: "CD - Deploy CLI Package to npm"

on:
  # Only ever called by release-please.yml — for a release it just created, or
  # for a republish dispatched there. This file has no dispatch entry point of
  # its own: npm binds the trusted publisher to the calling workflow's filename,
  # so a direct dispatch would advertise a fallback that cannot authenticate.
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/cli@0.2.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: npm-cli
      url: https://www.npmjs.com/package/@common-grants/cli
    permissions:
      contents: read
      # OIDC token for npm trusted publishing.
      id-token: write
    defaults:
      run:
        working-directory: ./lib/cli

    steps:
      # Rejects another package's tag or a malformed version. release-please's
      # own tag always passes; this is the guard on the tag a human typed into
      # the manual republish dispatch, and on that dispatch picking a package
      # whose tag belongs to a different one.
      # Runs before checkout (in the bare workspace) so nothing ever touches
      # content from an unvalidated ref.
      - name: Validate release tag
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^@common-grants/cli@[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::release_tag must look like '@common-grants/cli@X.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # The refs/tags/ qualifier pins the checkout to the tag namespace — a
      # branch with the same name can't be substituted, and a nonexistent tag
      # fails the checkout outright.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      # registry-url pins the publish registry; OIDC supplies the credential.
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter @common-grants/cli run checks

      # pnpm resolves the workspace-local specifiers (`catalog:`, `workspace:`)
      # while packing. npm would ship them verbatim, and a `catalog:` range left
      # in a published dependency field breaks every install — so pnpm builds
      # the tarball and npm only uploads it.
      - name: Pack package
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      # Node 22 still bundles npm 10, so install the npm that supports trusted
      # publishing. Pinned to the 11 line: a future npm major must not silently
      # change the release runtime.
      #
      # Every npm step runs from outside the checkout. The root package.json
      # declares npm `workspaces: ["lib/**"]`, whose glob also matches the built
      # `lib/changelog-emitter/dist/`, and npm aborts on the duplicate package
      # name before it resolves any config.
      - name: Install npm with trusted publishing support
        working-directory: ${{ runner.temp }}
        run: npm install -g "npm@^11.5.1"

      # Below either floor the OIDC exchange is skipped and npm falls back to the
      # placeholder credential setup-node left in .npmrc, so the job fails at the
      # registry with nothing pointing at the real cause. `.nvmrc` is not
      # release-scoped, so assert the Node floor rather than trusting it. This
      # makes a floor violation legible at release time; it does not catch one
      # earlier, since only the release workflows run this step.
      - name: Check publish runtime
        working-directory: ${{ runner.temp }}
        run: |
          node_version="$(node -v | tr -d v)"
          npm_version="$(npm -v)"
          echo "node $node_version, npm $npm_version"
          if ! printf '22.14.0\n%s\n' "$node_version" | sort -VC; then
            echo "::error::node $node_version is below the 22.14.0 that npm trusted publishing requires"
            exit 1
          fi
          if ! printf '11.5.1\n%s\n' "$npm_version" | sort -VC; then
            echo "::error::npm $npm_version is below the 11.5.1 that npm trusted publishing requires"
            exit 1
          fi

      # --provenance is redundant under trusted publishing, where npm attests
      # automatically, but pinning it keeps attestations from depending on that
      # default staying put.
      - name: Publish to npm
        working-directory: ${{ runner.temp }}
        run: npm publish --provenance --access public package.tgz

      - name: Notify completion
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "CLI package deployed to npm"
          echo "Tag: $RELEASE_TAG"
