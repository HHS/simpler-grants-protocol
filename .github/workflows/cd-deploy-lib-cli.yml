name: "CD - Deploy CLI Package to npm"

on:
  # Called by release-please.yml when a CLI release is created
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/cli@0.2.0)"
        required: true
        type: string
  # Manual fallback for re-running a publish against an existing tag
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/cli@0.2.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: npm-cli
      url: https://www.npmjs.com/package/@common-grants/cli
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./lib/cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      # Rejects a mistyped or spoofed ref (a branch, or another package's tag).
      # release-please's own tag always passes, so this only ever fires on the
      # manual workflow_dispatch fallback.
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^@common-grants/cli@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like '@common-grants/cli@X.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::release_tag is not an existing tag. Got: $RELEASE_TAG"
            exit 1
          fi

      # Setup .npmrc file to publish to npm
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter @common-grants/cli run checks

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks

      - name: Notify completion
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "CLI package deployed to npm"
          echo "Tag: $RELEASE_TAG"
