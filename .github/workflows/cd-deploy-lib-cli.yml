name: "CD - Deploy CLI Package to npm"

on:
  # Called by release-please.yml when a CLI release is created
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/cli@0.2.0)"
        required: true
        type: string
  # Manual fallback for re-running a publish against an existing tag
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/cli@0.2.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: npm-cli
      url: https://www.npmjs.com/package/@common-grants/cli
    permissions:
      contents: read
      # OIDC token for npm trusted publishing.
      id-token: write
    defaults:
      run:
        working-directory: ./lib/cli

    steps:
      # Rejects another package's tag or a malformed version on the manual
      # workflow_dispatch fallback; release-please's own tag always passes.
      # Runs before checkout (in the bare workspace) so nothing ever touches
      # content from an unvalidated ref.
      - name: Validate release tag
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^@common-grants/cli@[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::release_tag must look like '@common-grants/cli@X.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # The refs/tags/ qualifier pins the checkout to the tag namespace — a
      # branch with the same name can't be substituted, and a nonexistent tag
      # fails the checkout outright.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      # Setup .npmrc file to publish to npm
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter @common-grants/cli run checks

      # pnpm resolves this workspace's `catalog:` and `workspace:` specifiers
      # while packing; npm would publish them verbatim and break every install.
      # So pnpm builds the tarball and npm only uploads it.
      - name: Pack package
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0, and Node 22
      # still bundles npm 10. Pinned to the 11 line so a future npm major cannot
      # silently change the release runtime.
      #
      # Every npm step runs from outside the checkout: the root package.json
      # declares npm `workspaces: ["lib/**"]`, whose glob also matches the built
      # `lib/changelog-emitter/dist/`, and npm aborts on the duplicate package
      # name before it resolves any config.
      - name: Install npm with trusted publishing support
        working-directory: ${{ runner.temp }}
        run: npm install --global "npm@^11.5.1"

      - name: Publish to npm
        working-directory: ${{ runner.temp }}
        run: npm publish --provenance --access public package.tgz

      - name: Notify completion
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "CLI package deployed to npm"
          echo "Tag: $RELEASE_TAG"
