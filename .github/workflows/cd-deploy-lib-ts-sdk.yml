name: "CD - Deploy TypeScript SDK to npm"

on:
  # Called by release-please.yml when a TypeScript SDK release is created
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/sdk@0.2.0)"
        required: true
        type: string
  # Manual fallback for re-running a publish against an existing tag
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/sdk@0.2.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: npm-sdk
      url: https://www.npmjs.com/package/@common-grants/sdk
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./lib/ts-sdk

    steps:
      # The refs/tags/ qualifier pins the checkout to the tag namespace — a
      # branch with the same name can't be substituted, and a nonexistent tag
      # fails the checkout outright.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      # Rejects another package's tag or a malformed version on the manual
      # workflow_dispatch fallback; release-please's own tag always passes.
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^@common-grants/sdk@[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must look like '@common-grants/sdk@X.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # Setup .npmrc file to publish to npm
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter @common-grants/sdk run checks

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks

      - name: Notify completion
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "TypeScript SDK package deployed to npm"
          echo "Tag: $RELEASE_TAG"
