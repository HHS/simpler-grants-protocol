name: "CD - Deploy npm Package"

on:
  # npm authenticates the caller, not this reusable callee. release-please.yml
  # owns release/retry entry points; this callee serves all npm packages.
  workflow_call:
    inputs:
      package:
        description: "npm package name (e.g., @common-grants/core)"
        required: true
        type: string
      directory:
        description: "Workspace directory holding the package (e.g., lib/core)"
        required: true
        type: string
      environment:
        description: "GitHub environment the package's npm trusted publisher is registered against (e.g., npm-core)"
        required: true
        type: string
      release_tag:
        description: "Release tag (e.g., @common-grants/core@0.2.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # npm matches the environment as well as the calling workflow, so each
    # package keeps its own.
    environment:
      name: ${{ inputs.environment }}
      url: https://www.npmjs.com/package/${{ inputs.package }}
    permissions:
      contents: read
      # OIDC token for npm trusted publishing.
      id-token: write
    env:
      PACKAGE: ${{ inputs.package }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      # Validate manual retry tags against the selected package before checkout,
      # so untrusted ref content never enters the workspace.
      - name: Validate release tag
        run: |
          tag_pattern="^${PACKAGE}@[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$"
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            echo "::error::release_tag must look like '${PACKAGE}@X.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # Restrict checkout to tag refs; a same-named branch cannot satisfy it.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      # Node 24 supplies the npm 11 client trusted publishing requires. Normal
      # package CI continues to exercise the repository's Node 22 baseline.
      # registry-url pins the publish registry; OIDC supplies the credential.
      - name: Install Node.js publishing runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter "$PACKAGE" run checks

      # Pack with pnpm so workspace `catalog:` specs are resolved before npm
      # uploads the tarball.
      - name: Pack package
        working-directory: ${{ inputs.directory }}
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      # Publish from runner.temp to avoid npm's root-workspace duplicate-package
      # error. Trusted publishing generates provenance; keep the flag explicit.
      - name: Publish to npm
        working-directory: ${{ runner.temp }}
        run: npm publish --provenance --access public package.tgz

      - name: Notify completion
        run: echo "$PACKAGE deployed to npm from $RELEASE_TAG"
