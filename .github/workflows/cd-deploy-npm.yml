name: "CD - Deploy npm Package"

on:
  # Only ever called by release-please.yml — for a release it just created, or
  # for a republish dispatched there. This file has no dispatch entry point of
  # its own: npm binds the trusted publisher to the calling workflow's filename,
  # so a direct dispatch would advertise a fallback that cannot authenticate.
  # The callee's own filename is invisible to npm, so all three npm packages
  # share this one.
  workflow_call:
    inputs:
      package:
        description: "npm package name (e.g., @common-grants/core)"
        required: true
        type: string
      directory:
        description: "Workspace directory holding the package (e.g., lib/core)"
        required: true
        type: string
      environment:
        description: "GitHub environment the package's npm trusted publisher is registered against (e.g., npm-core)"
        required: true
        type: string
      release_tag:
        description: "Release tag (e.g., @common-grants/core@0.2.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # npm matches the environment as well as the calling workflow, so each
    # package keeps its own.
    environment:
      name: ${{ inputs.environment }}
      url: https://www.npmjs.com/package/${{ inputs.package }}
    permissions:
      contents: read
      # OIDC token for npm trusted publishing.
      id-token: write
    env:
      PACKAGE: ${{ inputs.package }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      # Rejects another package's tag or a malformed version. release-please's
      # own tag always passes; this is the guard on the tag a human typed into
      # the manual republish dispatch, and on that dispatch picking a package
      # whose tag belongs to a different one.
      # Runs before checkout (in the bare workspace) so nothing ever touches
      # content from an unvalidated ref.
      - name: Validate release tag
        run: |
          tag_pattern="^${PACKAGE}@[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$"
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            echo "::error::release_tag must look like '${PACKAGE}@X.Y.Z'. Got: $RELEASE_TAG"
            exit 1
          fi

      # The refs/tags/ qualifier pins the checkout to the tag namespace — a
      # branch with the same name can't be substituted, and a nonexistent tag
      # fails the checkout outright.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      # Node 24 supplies the npm 11 client trusted publishing requires. Normal
      # package CI continues to exercise the repository's Node 22 baseline.
      # registry-url pins the publish registry; OIDC supplies the credential.
      - name: Install Node.js publishing runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter "$PACKAGE" run checks

      # pnpm resolves this workspace's `catalog:` specifiers while packing. npm
      # would ship them verbatim, and a `catalog:` range left in a published
      # dependency field breaks every install — so pnpm builds the tarball and
      # npm only uploads it.
      - name: Pack package
        working-directory: ${{ inputs.directory }}
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      # npm runs outside the checkout because the root `workspaces` glob also
      # matches the built changelog emitter and npm rejects the duplicate name.
      # --provenance is redundant under trusted publishing, where npm attests
      # automatically, but pinning it keeps attestations from depending on that
      # default staying put.
      - name: Publish to npm
        working-directory: ${{ runner.temp }}
        run: npm publish --provenance --access public package.tgz

      - name: Notify completion
        run: echo "$PACKAGE deployed to npm from $RELEASE_TAG"
