name: "CI - Website: Validate and Deploy Preview"

on:
  workflow_call:
  pull_request:
    paths:
      - website/**
      - .github/workflows/ci-website-preview.yml
      - .github/scripts/upload-worker-preview.sh
      - pnpm-lock.yaml

defaults:
  run:
    working-directory: ./website

jobs:
  # Install, build, and run checks/tests. All post-build steps are sequential
  # but each runs regardless of the previous step's pass/fail so lint and test
  # failures all surface in a single CI run.
  validate:
    runs-on: ubuntu-latest
    outputs:
      # Read from the upload step (not the build step) so deploy-preview only
      # tries to download when the artifact actually exists.
      artifact_ready: ${{ steps.upload-build.outcome == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build site
        id: build
        run: pnpm run build

      - name: Upload build output
        # Path-structure invariant: every entry must stay under `website/` so
        # upload-artifact strips that common prefix and the deploy-preview
        # download (path: website) restores them at website/dist, etc. Adding
        # a path outside website/ shrinks the prefix and silently shifts
        # download locations.
        id: upload-build
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: website-build
          path: |
            website/dist
            website/tsp-output
            website/.extension-schemas
            website/cache
            website/public/schemas/yaml
            website/public/openapi
          retention-days: 1
          if-no-files-found: error

      - name: Run all checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run checks

      - name: Run tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run test

  # Upload the built artifact as a new version of the shared preview Worker,
  # aliased to this PR. Decoupled from the test/check outcome (via
  # artifact_ready) so previews stay available for reviewing UI changes on PRs
  # that have unrelated failures.
  deploy-preview:
    runs-on: ubuntu-latest
    needs: validate
    # !cancelled() (not always()) so a user-cancelled run skips the deploy.
    # Dependabot and workflow_call skipped: no PR number to build the alias.
    if: |
      !cancelled()
      && needs.validate.outputs.artifact_ready == 'true'
      && github.event_name == 'pull_request'
      && github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: website-build
          path: website

      - name: Upload Worker version (preview)
        id: upload
        # Run a script to:
        #  1. Upload a new website preview to the worker defined in wrangler.jsonc
        #  2. Parse the URL of that preview and print it to the GitHub output
        #  3. OR fail if the website isn't uploaded or the URL isn't parsed correctly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ../.github/scripts/upload-worker-preview.sh \
            "pr-${PR_NUMBER}" "PR #${PR_NUMBER} @ ${HEAD_SHA}"

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Website Preview Deployed

      - name: Post preview link comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 **Website Preview Deployed!**

            Preview your changes at: ${{ steps.upload.outputs.url }}

            Built from commit ${{ github.event.pull_request.head.sha }}
          edit-mode: replace
