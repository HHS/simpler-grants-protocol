name: "CD - Deploy Core Package to npm"

on:
  # Called by release-please.yml when a core release is created
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/core@0.2.0)"
        required: true
        type: string
  # Manual fallback for re-running a publish against an existing tag
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., @common-grants/core@0.2.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: npm-core
      url: https://www.npmjs.com/package/@common-grants/core
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./lib/core

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      # Setup .npmrc file to publish to npm
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm --filter @common-grants/core run checks

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks

      - name: Notify completion
        run: |
          echo "Core package deployed to npm"
          echo "Tag: ${{ inputs.release_tag }}"
