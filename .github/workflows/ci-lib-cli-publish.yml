name: "CI - CLI: Publish to npm (dry run)"

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/cli/**" # Trigger only if files in the `lib/cli/` directory are changed
      - ".github/workflows/ci-lib-cli-publish.yml"

defaults:
  run:
    working-directory: ./lib/cli

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core library
        run: pnpm --filter @common-grants/core run build

      - name: Run checks
        run: pnpm --filter @common-grants/cli run checks

      # Mirrors the release workflow's publish path so PR CI exercises the same
      # client: pnpm packs (resolving `catalog:`/`workspace:` specifiers), npm
      # inspects the tarball. npm runs outside the checkout because the root
      # package.json's npm `workspaces: ["lib/**"]` glob also matches the built
      # `lib/changelog-emitter/dist/`, which npm rejects as a duplicate package.
      - name: Pack package
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      - name: Install npm matching the release workflow
        working-directory: ${{ runner.temp }}
        run: npm install --global "npm@^11.5.1"

      - name: Dry run publish
        working-directory: ${{ runner.temp }}
        run: npm publish --dry-run --access public package.tgz
