name: "CI - Core: Publish to npm (dry run)"

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/core/**" # Trigger only if files in the `lib/core/` directory are changed
      - ".github/workflows/ci-lib-core-publish.yml"

defaults:
  run:
    working-directory: ./lib/core

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors the release workflow's packaging and client: pnpm packs
      # (resolving `catalog:`/`workspace:` specifiers), npm validates the
      # tarball. It cannot exercise --provenance, which needs the OIDC token
      # this workflow deliberately does not get.
      #
      # npm runs outside the checkout because the root package.json's npm
      # `workspaces: ["lib/**"]` glob also matches the built
      # `lib/changelog-emitter/dist/`, which npm rejects as a duplicate package.
      - name: Pack package
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      - name: Install npm matching the release workflow
        working-directory: ${{ runner.temp }}
        run: npm install -g "npm@^11.5.1"

      # --force skips only npm's "this version is already published" check,
      # which is always true on a PR — the bump lands in the Release PR. Without
      # it every PR here fails. Manifest and tarball validation still run, and
      # --dry-run keeps anything from reaching the registry.
      - name: Dry run publish
        working-directory: ${{ runner.temp }}
        run: npm publish --dry-run --force --access public package.tgz
