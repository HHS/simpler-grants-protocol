name: "CI - CLI: Run Checks"

on:
  workflow_call:
  pull_request:
    paths:
      - lib/cli/**
      - .github/workflows/ci-lib-cli.yml

defaults:
  run:
    working-directory: ./lib/cli

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core library
        run: pnpm --filter @common-grants/core run build

      - name: Run checks
        run: pnpm --filter @common-grants/cli run checks

      - name: Run tests
        run: pnpm --filter @common-grants/cli test:coverage

      - name: Build library
        run: pnpm --filter @common-grants/cli run build
