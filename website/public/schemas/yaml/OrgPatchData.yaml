$schema: https://json-schema.org/draft/2020-12/schema
$id: OrgPatchData.yaml
type: object
properties:
  name:
    type: string
    description: The organization's legal name as registered with relevant authorities.
  mission:
    anyOf:
      - type: string
      - type: "null"
    description: The organization's mission statement.
  yearFounded:
    anyOf:
      - $ref: calendarYear.yaml
      - type: "null"
    description: The calendar year the organization was founded.
  identifiers:
    anyOf:
      - $ref: "#/$defs/OrgPatchOrgIdsOrCreate"
      - type: "null"
    description: Identifiers associated with the organization, keyed by registry code.
  orgType:
    anyOf:
      - $ref: "#/$defs/OrgPatchPCSOrgTypeOrCreate"
      - type: "null"
    description: The organization's type within the Philanthropy Classification System (PCS).
  addresses:
    anyOf:
      - $ref: "#/$defs/OrgPatchAddressCollectionOrCreate"
      - type: "null"
    description: Collection of physical addresses associated with the organization.
  phones:
    anyOf:
      - $ref: "#/$defs/OrgPatchPhoneCollectionOrCreate"
      - type: "null"
    description: Collection of phone numbers associated with the organization.
  emails:
    anyOf:
      - $ref: "#/$defs/OrgPatchEmailCollectionOrCreate"
      - type: "null"
    description: Collection of email addresses associated with the organization.
  socials:
    anyOf:
      - $ref: "#/$defs/OrgPatchOrgSocialLinksOrCreate"
      - type: "null"
    description: Collection of the organization's social media and web presence links.
  dbaNames:
    anyOf:
      - type: array
        items:
          type: string
      - type: "null"
    description: Names the organization currently does business as, alongside its legal `name`. Not a history of former names.
  relationships:
    anyOf:
      - type: object
        properties:
          parents:
            anyOf:
              - type: object
                properties:
                  parent:
                    anyOf:
                      - type: array
                        items:
                          $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
                      - type: "null"
                    description: Confirmed containment when no more specific supported kind is known.
                  department:
                    anyOf:
                      - type: array
                        items:
                          $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
                      - type: "null"
                    description: An internal organizational unit within the target, such as a division or school.
                  chapter:
                    anyOf:
                      - type: array
                        items:
                          $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
                      - type: "null"
                    description: A local or regional unit under the target's organizational structure, not merely a member of its network.
                  subsidiary:
                    anyOf:
                      - type: array
                        items:
                          $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
                      - type: "null"
                    description: A separate entity owned or controlled by the target.
                  otherParents:
                    anyOf:
                      - type: object
                        properties: {}
                        unevaluatedProperties:
                          anyOf:
                            - type: array
                              items:
                                $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
                            - type: "null"
                      - type: "null"
                    description: Additional hierarchy kinds, keyed by a documented label that describes containment by the target.
                unevaluatedProperties:
                  not: {}
              - type: "null"
            description: Organizations that directly contain this organization, grouped by hierarchy kind.
          fiscalSponsor:
            anyOf:
              - type: object
                properties:
                  id:
                    $ref: uuid.yaml
                    description: The target organization's unique identifier.
                  name:
                    anyOf:
                      - type: string
                      - type: "null"
                    description: The target organization's legal name, checked against the target when supplied.
