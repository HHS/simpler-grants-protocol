$schema: https://json-schema.org/draft/2020-12/schema
$id: OrgPatchData.yaml
type: object
properties:
  name:
    type: string
    description: The organization's legal name as registered with relevant authorities.
  mission:
    anyOf:
      - type: string
      - type: "null"
    description: The organization's mission statement.
  yearFounded:
    anyOf:
      - $ref: calendarYear.yaml
      - type: "null"
    description: The calendar year the organization was founded.
  identifiers:
    anyOf:
      - $ref: "#/$defs/OrgPatchOrgIdsOrCreate"
      - type: "null"
    description: Identifiers associated with the organization, keyed by registry code.
  orgType:
    anyOf:
      - $ref: "#/$defs/OrgPatchPCSOrgTypeOrCreate"
      - type: "null"
    description: The organization's type within the Philanthropy Classification System (PCS).
  addresses:
    anyOf:
      - $ref: "#/$defs/OrgPatchAddressCollectionOrCreate"
      - type: "null"
    description: Collection of physical addresses associated with the organization.
  phones:
    anyOf:
      - $ref: "#/$defs/OrgPatchPhoneCollectionOrCreate"
      - type: "null"
    description: Collection of phone numbers associated with the organization.
  emails:
    anyOf:
      - $ref: "#/$defs/OrgPatchEmailCollectionOrCreate"
      - type: "null"
    description: Collection of email addresses associated with the organization.
  socials:
    anyOf:
      - $ref: "#/$defs/OrgPatchOrgSocialLinksOrCreate"
      - type: "null"
    description: Collection of the organization's social media and web presence links.
  dbaNames:
    anyOf:
      - type: array
        items:
          type: string
      - type: "null"
    description: Names the organization currently does business as, alongside its legal `name`. Not a history of former names.
  relationships:
    anyOf:
      - $ref: "#/$defs/OrgPatchOrgRelationshipsOrCreate"
      - type: "null"
    description: The organization's relationships to other organizations, such as containing organizations or a fiscal sponsor.
  customFields:
    anyOf:
      - type: object
        properties: {}
        unevaluatedProperties:
          anyOf:
            - $ref: OrgPatchCustomFieldOrCreate.yaml
            - type: "null"
      - type: "null"
    description: Custom fields for the organization.
unevaluatedProperties:
  not: {}
examples:
  - name: Example Nonprofit (Renamed)
    mission: To expand access to community health resources.
    yearFounded: null
    socials:
      website: null
    emails:
      primary: info@example.org
    customFields:
      legacyCode: null
description: |-
  A JSON Merge Patch (RFC 7396) body for updating an organization profile.

  Derived from `OrganizationBase`: every field is optional, fields that can
  be cleared accept `null` to unset them, record keys can be deleted by
  setting them to `null`, and read-only fields like `id` are excluded.
  Sent as `application/merge-patch+json`.
$defs:
  OrgPatchOrgIdsOrCreate:
    type: object
    properties:
      org:us:ein:
        anyOf:
          - $ref: OrgPatchOrgIdEinOrCreate.yaml
          - type: "null"
        description: The organization's Employer Identification Number (EIN), assigned by the IRS.
      org:us:uei:
        anyOf:
          - $ref: OrgPatchOrgIdUeiOrCreate.yaml
          - type: "null"
        description: The organization's Unique Entity Identifier (UEI) from SAM.gov.
      org:xi:duns:
        anyOf:
          - $ref: OrgPatchOrgIdDunsOrCreate.yaml
          - type: "null"
        description: The organization's Data Universal Numbering System (DUNS) number.
      systemId:
        anyOf:
          - $ref: OrgPatchSystemIdOrCreate.yaml
          - type: "null"
        description: The hosting system's own identifier for this record.
      otherIds:
        anyOf:
          - type: object
            properties: {}
            unevaluatedProperties:
              anyOf:
                - $ref: OrgPatchIdentifierOrCreate.yaml
                - type: "null"
          - type: "null"
        description: |-
          Additional identifiers keyed by their registry code, for registries the
          protocol does not define as a base identifier on the model.
    unevaluatedProperties:
      not: {}
    description: |-
      A collection of identifiers associated with an organization.

      Extends the generic identifier collection with the base identifiers CommonGrants
      defines for organizations. Additional registries can be published under `otherIds`.
  OrgPatchPCSOrgTypeOrCreate:
    type: object
    properties:
      class:
        type: string
        const: Organization types
        description: The PCS term for the organization type.
      term:
        type: string
        description: The plain language PCS term.
      code:
        type: string
        examples:
          - UC000000
        pattern: ^[A-Z]{2}[0-9]{6}$
        description: The code for this PCS term.
      description:
        anyOf:
          - type: string
          - type: "null"
        description: Description of the PCS term
    unevaluatedProperties:
      not: {}
    description: |-
      A Philanthropy Classification System (PCS) term for organization types.

      See https://taxonomy.candid.org/organization-type for more information.
  OrgPatchAddressCollectionOrCreate:
    type: object
    properties:
      primary:
        $ref: OrgPatchAddressOrCreate.yaml
        description: The primary address for a person or organization.
      otherAddresses:
        anyOf:
          - type: object
            properties: {}
            unevaluatedProperties:
              anyOf:
                - $ref: OrgPatchAddressOrCreate.yaml
                - type: "null"
          - type: "null"
        description: Additional addresses keyed by a descriptive label (e.g., "work", "home", "international").
    unevaluatedProperties:
      not: {}
    description: A collection of addresses.
  OrgPatchPhoneCollectionOrCreate:
    type: object
    properties:
      primary:
        $ref: OrgPatchPhoneOrCreate.yaml
        description: The person's primary phone number.
      fax:
        anyOf:
          - $ref: OrgPatchPhoneOrCreate.yaml
          - type: "null"
        description: The person's fax number, if applicable.
      otherPhones:
        anyOf:
          - type: object
            properties: {}
            unevaluatedProperties:
              anyOf:
                - $ref: OrgPatchPhoneOrCreate.yaml
                - type: "null"
          - type: "null"
        description: Additional phone numbers not covered by the standard fields.
    unevaluatedProperties:
      not: {}
    description: A collection of phone numbers for a person.
  OrgPatchEmailCollectionOrCreate:
    type: object
    properties:
      primary:
        $ref: email.yaml
        description: The primary email address for a person or organization.
      otherEmails:
        anyOf:
          - type: object
            properties: {}
            unevaluatedProperties:
              anyOf:
                - $ref: email.yaml
                - type: "null"
          - type: "null"
        description: Additional email addresses keyed by a descriptive label (e.g., "work", "personal", "support").
    unevaluatedProperties:
      not: {}
    description: A collection of email addresses.
  OrgPatchOrgSocialLinksOrCreate:
    type: object
    properties:
      website:
        anyOf:
          - type: string
            format: uri
          - type: "null"
        description: The organization's primary website URL.
      facebook:
        anyOf:
          - type: string
            format: uri
          - type: "null"
        description: The organization's Facebook profile URL.
      twitterOrX:
        anyOf:
          - type: string
            format: uri
          - type: "null"
        description: The organization's Twitter/X profile URL.
      bluesky:
        anyOf:
          - type: string
            format: uri
          - type: "null"
        description: The organization's BlueSky profile URL.
      instagram:
        anyOf:
          - type: string
            format: uri
          - type: "null"
        description: The organization's Instagram profile URL.
      linkedin:
        anyOf:
          - type: string
            format: uri
          - type: "null"
        description: The organization's LinkedIn profile URL.
      otherSocials:
        anyOf:
          - type: object
            properties: {}
            unevaluatedProperties:
              anyOf:
                - type: string
                  format: uri
                - type: "null"
          - type: "null"
        description: Additional social media profiles not covered by the standard fields.
    unevaluatedProperties:
      not: {}
    description: A collection of social media and web presence links for an organization.
  OrgPatchOrgRelationshipsOrCreate:
    type: object
    properties:
      parents:
        anyOf:
          - $ref: "#/$defs/OrgPatchOrgParentsOrCreate"
          - type: "null"
        description: Organizations that directly contain this organization, grouped by hierarchy kind.
      fiscalSponsor:
        anyOf:
          - $ref: "#/$defs/OrgPatchOrgTargetRefOrCreate"
          - type: "null"
        description: The organization that fiscally sponsors this organization or project. A payee designation alone does not establish sponsorship.
      successor:
        anyOf:
          - $ref: "#/$defs/OrgPatchOrgTargetRefOrCreate"
          - type: "null"
        description: A different organization that replaces this dissolved organization. A rename or sponsor change alone does not establish succession.
      duplicateOf:
        anyOf:
          - $ref: "#/$defs/OrgPatchOrgTargetRefOrCreate"
          - type: "null"
        description: The canonical record of the same organization, when this record is a duplicate of it.
      otherRelationships:
        anyOf:
          - type: object
            properties: {}
            unevaluatedProperties:
              anyOf:
                - type: array
                  items:
                    $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
                - type: "null"
          - type: "null"
        description: Additional nonhierarchical relationships, keyed by a documented label. Must not hold containment, fiscal sponsors, successors, or duplicate targets.
    unevaluatedProperties:
      not: {}
    description: |-
      An organization's relationships to other organizations.

      Every reference is stated on this organization and points to its target.
      Hierarchy is grouped by kind under `parents`; fiscal sponsorship,
      succession, and duplicate identity are distinct singular references. A
      relationship confers no authority over its target.
  OrgPatchOrgParentsOrCreate:
    type: object
    properties:
      parent:
        anyOf:
          - type: array
            items:
              $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
          - type: "null"
        description: Confirmed containment when no more specific supported kind is known.
      department:
        anyOf:
          - type: array
            items:
              $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
          - type: "null"
        description: An internal organizational unit within the target, such as a division or school.
      chapter:
        anyOf:
          - type: array
            items:
              $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
          - type: "null"
        description: A local or regional unit under the target's organizational structure, not merely a member of its network.
      subsidiary:
        anyOf:
          - type: array
            items:
              $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
          - type: "null"
        description: A separate entity owned or controlled by the target.
      otherParents:
        anyOf:
          - type: object
            properties: {}
            unevaluatedProperties:
              anyOf:
                - type: array
                  items:
                    $ref: "#/$defs/OrgPatchOrgTargetRefReplaceOnly"
                - type: "null"
          - type: "null"
        description: Additional hierarchy kinds, keyed by a documented label that describes containment by the target.
    unevaluatedProperties:
      not: {}
    description: |-
      Organizations that directly contain an organization, grouped by hierarchy kind.

      Each kind holds an array so several targets can share a kind; array order
      carries no primary-parent or ranking meaning. Use the most specific known
      kind, and do not repeat a target as both `parent` and a more specific kind.
  OrgPatchOrgTargetRefOrCreate:
    type: object
    properties:
      id:
        $ref: uuid.yaml
        description: The target organization's unique identifier.
      name:
        anyOf:
          - type: string
          - type: "null"
        description: The target organization's legal name, checked against the target when supplied.
      identifiers:
        anyOf:
          - $ref: "#/$defs/OrgPatchOrgIdsOrCreate"
          - type: "null"
        description: Identifiers associated with the target organization, checked against the target when supplied.
    unevaluatedProperties:
      not: {}
    description: |-
      A writable reference to a relationship's target organization.

      Unlike `Models.OrgRef`, whose `id` is read-only, `id` is writable here so a
      patch can name the target, and `name` is optional so the target can be
      named by ID alone. The provider resolves the target, refreshes its name and
      provider-derived identifiers, and rejects an unresolved target or
      contradictory metadata the sender supplies.
  OrgPatchOrgTargetRefReplaceOnly:
    type: object
    properties:
      id:
        $ref: uuid.yaml
        description: The target organization's unique identifier.
      name:
        type: string
        description: The target organization's legal name, checked against the target when supplied.
      identifiers:
        $ref: "#/$defs/OrgPatchOrgIdsReplaceOnly"
        description: Identifiers associated with the target organization, checked against the target when supplied.
    required:
      - id
    unevaluatedProperties:
      not: {}
    description: |-
      A writable reference to a relationship's target organization.

      Unlike `Models.OrgRef`, whose `id` is read-only, `id` is writable here so a
      patch can name the target, and `name` is optional so the target can be
      named by ID alone. The provider resolves the target, refreshes its name and
      provider-derived identifiers, and rejects an unresolved target or
      contradictory metadata the sender supplies.
  OrgPatchOrgIdsReplaceOnly:
    type: object
    properties:
      org:us:ein:
        $ref: OrgPatchOrgIdEinReplaceOnly.yaml
        description: The organization's Employer Identification Number (EIN), assigned by the IRS.
      org:us:uei:
        $ref: OrgPatchOrgIdUeiReplaceOnly.yaml
        description: The organization's Unique Entity Identifier (UEI) from SAM.gov.
      org:xi:duns:
        $ref: OrgPatchOrgIdDunsReplaceOnly.yaml
        description: The organization's Data Universal Numbering System (DUNS) number.
      systemId:
        $ref: OrgPatchSystemIdReplaceOnly.yaml
        description: The hosting system's own identifier for this record.
      otherIds:
        type: object
        properties: {}
        unevaluatedProperties:
          anyOf:
            - $ref: OrgPatchIdentifierReplaceOnly.yaml
            - type: "null"
        description: |-
          Additional identifiers keyed by their registry code, for registries the
          protocol does not define as a base identifier on the model.
    unevaluatedProperties:
      not: {}
    description: |-
      A collection of identifiers associated with an organization.

      Extends the generic identifier collection with the base identifiers CommonGrants
      defines for organizations. Additional registries can be published under `otherIds`.
