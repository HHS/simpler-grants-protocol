$schema: https://json-schema.org/draft/2020-12/schema
$id: OrgRelationships.yaml
type: object
properties:
  parents:
    anyOf:
      - type: object
        properties:
          parent:
            anyOf:
              - type: array
                items:
                  $ref: OrgRef.yaml
              - type: "null"
            description: Confirmed containment when no more specific supported kind is known.
          department:
            anyOf:
              - type: array
                items:
                  $ref: OrgRef.yaml
              - type: "null"
            description: An internal organizational unit within the target, such as a division or school.
          chapter:
            anyOf:
              - type: array
                items:
                  $ref: OrgRef.yaml
              - type: "null"
            description: A local or regional unit under the target's organizational structure, not merely a member of its network.
          subsidiary:
            anyOf:
              - type: array
                items:
                  $ref: OrgRef.yaml
              - type: "null"
            description: A separate entity owned or controlled by the target.
          otherParents:
            anyOf:
              - $ref: "#/$defs/RecordArrayOrgRef"
              - type: "null"
            description: Additional hierarchy kinds, keyed by a documented label that describes containment by the target.
        unevaluatedProperties:
          not: {}
      - type: "null"
    description: Organizations that directly contain this organization, grouped by hierarchy kind.
  fiscalSponsor:
    anyOf:
      - type: object
        properties:
          id:
            $ref: uuid.yaml
            description: The organization's unique identifier.
          name:
            type: string
            description: The organization's legal name as registered with relevant authorities.
          identifiers:
            $ref: OrgIds.yaml
            description: Identifiers associated with the organization, keyed by registry code.
        required:
          - id
          - name
        unevaluatedProperties:
          not: {}
      - type: "null"
    description: The organization that fiscally sponsors this organization or project. A payee designation alone does not establish sponsorship.
  successor:
    anyOf:
      - type: object
        properties:
          id:
            $ref: uuid.yaml
            description: The organization's unique identifier.
          name:
            type: string
            description: The organization's legal name as registered with relevant authorities.
          identifiers:
            $ref: OrgIds.yaml
            description: Identifiers associated with the organization, keyed by registry code.
        required:
          - id
          - name
        unevaluatedProperties:
          not: {}
      - type: "null"
    description: A different organization that replaces this dissolved organization. A rename or sponsor change alone does not establish succession.
  duplicateOf:
    anyOf:
      - type: object
        properties:
          id:
            $ref: uuid.yaml
            description: The organization's unique identifier.
          name:
            type: string
            description: The organization's legal name as registered with relevant authorities.
          identifiers:
            $ref: OrgIds.yaml
            description: Identifiers associated with the organization, keyed by registry code.
        required:
          - id
          - name
        unevaluatedProperties:
          not: {}
      - type: "null"
    description: The canonical record of the same organization, when this record is a duplicate of it.
  otherRelationships:
    anyOf:
      - $ref: "#/$defs/RecordArrayOrgRef"
      - type: "null"
    description: Additional nonhierarchical relationships, keyed by a documented label. Must not hold containment, fiscal sponsors, successors, or duplicate targets.
unevaluatedProperties:
  not: {}
examples:
  - parents:
      department:
        - id: 6f1d2c3b-4a59-4e68-8a7b-9c0d1e2f3a4b
          name: Example Medical Center
          identifiers:
            org:us:ein:
              registry:
                code: org:us:ein
              id: "123456789"
    fiscalSponsor:
      id: 8b3f4e5d-6c7b-4a8a-8c9d-1e2f3a4b5c6d
      name: Example Community Foundation
description: |-
  An organization's relationships to other organizations.

  Every reference is stated on this organization and points to its target.
  Hierarchy is grouped by kind under `parents`; fiscal sponsorship,
  succession, and duplicate identity are distinct singular references. A
  relationship confers no authority over its target.
$defs:
  RecordArrayOrgRef:
    type: object
    properties: {}
    unevaluatedProperties:
      type: array
      items:
        $ref: OrgRef.yaml
