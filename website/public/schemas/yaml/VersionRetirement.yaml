$schema: https://json-schema.org/draft/2020-12/schema
$id: VersionRetirement.yaml
type: object
properties:
  deprecation:
    type: string
    format: date-time
    description: When the version was or will be deprecated
  sunset:
    type: string
    format: date-time
    description: When the server will stop serving the version, if scheduled
required:
  - deprecation
unevaluatedProperties: {}
description: The retirement schedule for a deprecated version
