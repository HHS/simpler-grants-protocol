$schema: https://json-schema.org/draft/2020-12/schema
$id: VersionMalformedError.yaml
type: object
properties:
  status:
    type: number
    const: 400
    examples:
      - 400
  errors:
    type: array
    items:
      $ref: VersionMalformedDetail.yaml
    minItems: 1
required:
  - status
  - errors
allOf:
  - $ref: Error.yaml
unevaluatedProperties:
  not: {}
examples:
  - status: 400
    message: The CG-Version header is not a valid CommonGrants version
    errors:
      - field: CG-Version
        code: version.malformed
        message: Version 0.5 is not a full MAJOR.MINOR.PATCH version
        requested: "0.5"
        supported:
          - 0.5.0
          - 0.6.0
        defaultVersion: 0.5.0
        discovery: https://grants.example.org/common-grants/versions
description: A `CG-Version` header that isn't a full `MAJOR.MINOR.PATCH` version
