$schema: https://json-schema.org/draft/2020-12/schema
$id: OrgParents.yaml
type: object
properties:
  parent:
    anyOf:
      - type: array
        items:
          $ref: OrgRef.yaml
      - type: "null"
    description: Confirmed containment when no more specific supported kind is known.
  department:
    anyOf:
      - type: array
        items:
          $ref: OrgRef.yaml
      - type: "null"
    description: An internal organizational unit within the target, such as a division or school.
  chapter:
    anyOf:
      - type: array
        items:
          $ref: OrgRef.yaml
      - type: "null"
    description: A local or regional unit under the target's organizational structure, not merely a member of its network.
  subsidiary:
    anyOf:
      - type: array
        items:
          $ref: OrgRef.yaml
      - type: "null"
    description: A separate entity owned or controlled by the target.
  otherParents:
    anyOf:
      - $ref: "#/$defs/RecordArrayOrgRef"
      - type: "null"
    description: Additional hierarchy kinds, keyed by a documented label that describes containment by the target.
unevaluatedProperties:
  not: {}
examples:
  - department:
      - id: 6f1d2c3b-4a59-4e68-8a7b-9c0d1e2f3a4b
        name: Example Medical Center
        identifiers:
          org:us:ein:
            registry:
              code: org:us:ein
            id: "123456789"
description: |-
  Organizations that directly contain an organization, grouped by hierarchy kind.

  Each kind holds an array so several targets can share a kind; array order
  carries no primary-parent or ranking meaning. Use the most specific known
  kind, and do not repeat a target as both `parent` and a more specific kind.
$defs:
  RecordArrayOrgRef:
    type: object
    properties: {}
    unevaluatedProperties:
      type: array
      items:
        $ref: OrgRef.yaml
