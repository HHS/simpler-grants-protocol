$schema: https://json-schema.org/draft/2020-12/schema
$id: VersionUnsupportedError.yaml
type: object
properties:
  status:
    type: number
    const: 406
    examples:
      - 406
  errors:
    type: array
    items:
      $ref: VersionUnsupportedDetail.yaml
    minItems: 1
required:
  - status
  - errors
allOf:
  - $ref: Error.yaml
unevaluatedProperties:
  not: {}
examples:
  - status: 406
    message: The requested CommonGrants version is not available for this route
    errors:
      - field: CG-Version
        code: version.unsupported
        message: "Version 0.4.0 is not served by GET /common-grants/forms. Supported versions: 0.5.0, 0.6.0"
        requested: 0.4.0
        supported:
          - 0.5.0
          - 0.6.0
        scope: operation
        defaultVersion: 0.5.0
        discovery: https://grants.example.org/common-grants/versions
description: A requested version that this server or route doesn't serve
