$schema: https://json-schema.org/draft/2020-12/schema
$id: OppIds.yaml
type: object
properties:
  opp:us:fon:
    $ref: OppIdFon.yaml
    description: The opportunity's Federal Opportunity Number (FON).
  opp:us:aln:
    $ref: OppIdAln.yaml
    description: The opportunity's Assistance Listing Number (ALN).
allOf:
  - $ref: IdentifierCollection.yaml
unevaluatedProperties:
  not: {}
examples:
  - systemId:
      registry:
        code: opp:grants.gov:system
      id: 018f2e77-3a4b-7c1d-9e2f-abcdef123456
    opp:us:fon:
      registry:
        code: opp:us:fon
        url: https://commongrants.org/registries/opp-us-fon
      id: HHS-2026-ACF-OCC-YD-0001
    opp:us:aln:
      registry:
        code: opp:us:aln
        url: https://commongrants.org/registries/opp-us-aln
      id: "93.575"
description: |-
  A collection of identifiers associated with an opportunity.

  Extends the generic identifier collection with the base identifiers CommonGrants
  defines for opportunities. Additional registries can be published under `otherIds`.
