allowBuilds:
  "@scarf/scarf": false
  esbuild: false
# Config for this standalone template (pnpm 11+ reads settings from
# pnpm-workspace.yaml, not the package.json "pnpm" field).
# Overrides are security floors for transitive deps; remove each once the
# parent dep chain resolves past the floor on its own.
overrides:
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0"
  "brace-expansion@>=1 <1.1.18": "1.1.18"
  "brace-expansion@>=3 <5.0.9": "5.0.9"
  "flatted@<3.4.0": "3.4.2"
  "minimatch@>=3 <3.1.5": "3.1.5"
  "path-to-regexp@>=0.1 <0.1.13": "0.1.13"
  "picomatch@>=2 <2.3.2": "2.3.2"
  "picomatch@>=4 <4.0.4": "4.0.4"
  "qs@<6.15.2": "6.15.2"
  "rollup@>=4 <4.59.0": "4.60.1"
  "tar@<7.5.21": "7.5.21"
  "vite@>=7.0.0 <=7.3.1": ">=7.3.2"
  "yaml@>=2 <2.8.3": "2.8.3"
