# Config for this standalone template (pnpm 11+ reads settings from
# pnpm-workspace.yaml, not the package.json "pnpm" field).
# Overrides are security floors for transitive deps; remove each once the
# parent dep chain resolves past the floor on its own.
overrides:
  "ajv@>=7 <8.18.0": "8.18.0"
  "fast-uri@>=3 <3.1.6": "3.1.6"
  "picomatch@>=2 <2.3.2": "2.3.2"
  "tar@<7.5.21": "7.5.21"
  "yaml@>=2 <2.8.3": "2.8.3"

# Audit exceptions. Remove each once a patched release exists upstream.
#   GHSA-2q42-4q24-7rgv  high  @typespec/compiler + @typespec/openapi3 <=1.15.0 (no patched version as of 2026-09-08)
auditConfig:
  ignoreGhsas:
    - GHSA-2q42-4q24-7rgv
